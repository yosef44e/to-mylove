<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0006;
    --surface: #170309;
    --rose: #ff2d6b;
    --rose-deep: #7a0a30;
    --mauve: #3a0c1f;
    --text: #f6e6ea;
    --text-dim: #b98a97;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: var(--bg);
    overflow:hidden;
  }

  body{
    font-family:'Tajawal', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* خلفية ضبابية رومانسية */
  .glow{
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.55;
    pointer-events:none;
  }
  .glow.one{
    width:420px; height:420px;
    background: var(--rose-deep);
    top:-120px; right:-100px;
  }
  .glow.two{
    width:360px; height:360px;
    background: var(--mauve);
    bottom:-140px; left:-80px;
  }

  /* جزيئات متطايرة خفيفة */
  .petal{
    position:absolute;
    width:6px; height:6px;
    background: var(--rose);
    border-radius:50%;
    opacity:0.35;
    animation: drift linear infinite;
  }
  @keyframes drift{
    from{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.5; }
    to{ transform: translateY(-100vh) translateX(20px); opacity:0; }
  }

  .card{
    position:relative;
    z-index:2;
    text-align:center;
    padding:60px 40px;
    max-width:420px;
  }

  .heart{
    width:54px; height:54px;
    margin:0 auto 22px;
    position:relative;
    animation: beat 1.8s ease-in-out infinite;
  }
  .heart svg{ width:100%; height:100%; filter: drop-shadow(0 0 18px rgba(255,45,107,0.65)); }
  @keyframes beat{
    0%, 100%{ transform: scale(1); }
    15%{ transform: scale(1.15); }
    30%{ transform: scale(1); }
    45%{ transform: scale(1.1); }
    60%{ transform: scale(1); }
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 2.1rem;
    color: var(--text);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  p.subtitle{
    color: var(--text-dim);
    font-size: 0.95rem;
    font-weight:300;
    margin-bottom: 40px;
    line-height:1.8;
  }

  .btn{
    display:inline-block;
    text-decoration:none;
    color: var(--text);
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    padding: 16px 46px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight:700;
    letter-spacing: 0.5px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 30px -8px rgba(255,45,107,0.55);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position:relative;
  }
  .btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 16px 40px -6px rgba(255,45,107,0.75);
  }
  .btn:active{ transform: translateY(-1px) scale(0.98); }

  .footer-note{
    margin-top: 26px;
    font-size: 0.75rem;
    color: rgba(185,138,151,0.5);
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .heart, .petal{ animation: none; }
  }
</style>
</head>
<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- جزيئات متطايرة -->
  <div class="petal" style="left:10%; animation-duration:9s; animation-delay:0s;"></div>
  <div class="petal" style="left:25%; animation-duration:12s; animation-delay:2s;"></div>
  <div class="petal" style="left:45%; animation-duration:8s; animation-delay:1s;"></div>
  <div class="petal" style="left:65%; animation-duration:11s; animation-delay:3s;"></div>
  <div class="petal" style="left:80%; animation-duration:10s; animation-delay:1.5s;"></div>
  <div class="petal" style="left:92%; animation-duration:13s; animation-delay:0.5s;"></div>

  <div class="card">
    <div class="heart">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 21s-7.5-4.9-10.2-9.3C0.1 8.9 1.4 5 5 4.1c2.2-0.6 4.2 0.5 5.5 2.4C11.8 4.6 13.8 3.5 16 4.1c3.6 0.9 4.9 4.8 3.2 7.6C19.5 16.1 12 21 12 21z" fill="url(#g)"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
            <stop offset="0%" stop-color="#ff2d6b"/>
            <stop offset="100%" stop-color="#7a0a30"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1>تفضّل من هنا</h1>
    <p class="subtitle">كل ضغطة على القلب بتوصلك لحاجة أحلى</p>

    <!-- 
      غيّر الرابط اللي جوه href بالرابط بتاعك انت 
      مثال: href="https://instagram.com/username"
    -->
    <a class="btn" href="https://confident-crimp-pang.ngrok-free.dev" target="_blank" rel="noopener noreferrer">فيديو بيفكرني بيكي</a>

    <div class="footer-note">yosef by7bk ya Zainab</div>
  </div>

</body>
</html>
