<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لكي يا قلبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0b0507;
    --wine: #3a0d18;
    --wine-deep: #1c0509;
    --ember: #a8324a;
    --gold: #c9a15a;
    --ivory: #eee2d6;
    --line: rgba(201,161,90,0.25);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: var(--void);
    color: var(--ivory);
    font-family: 'Amiri', serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 32px 20px;
    position:relative;
  }

  /* خلفية متوهجة داكنة، مثل ضوء شمعة بعيد */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 18%, rgba(168,50,74,0.35), transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 90%, rgba(58,13,24,0.55), transparent 65%),
      radial-gradient(ellipse 70% 50% at 10% 85%, rgba(28,5,9,0.7), transparent 65%),
      var(--void);
    z-index:-2;
  }

  /* حبيبات دقيقة تعطي إحساس دفء وقِدَم */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    opacity:0.05;
    background-image: radial-gradient(circle, #fff 1px, transparent 1px);
    background-size: 3px 3px;
    z-index:-1;
    pointer-events:none;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 460px;
    text-align:center;
    padding: 56px 34px 44px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: linear-gradient(180deg, rgba(28,5,9,0.55), rgba(11,5,7,0.75));
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 30px 60px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(168,50,74,0.06);
  }

  /* زخرفة زوايا بسيطة بدل الإطار الجاهز */
  .card::before, .card::after{
    content:"";
    position:absolute;
    width:26px; height:26px;
    border: 1px solid var(--gold);
    opacity:0.55;
  }
  .card::before{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .card::after{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  .eyebrow{
    font-family:'Aref Ruqaa', serif;
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 1px;
    margin: 0 0 18px;
    opacity:0.85;
  }

  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(34px, 8vw, 52px);
    line-height:1.35;
    margin: 0 0 22px;
    color: var(--ivory);
    text-shadow: 0 0 24px rgba(168,50,74,0.45);
  }

  .divider{
    width: 70px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 26px;
  }

  p.body-text{
    font-size: 20px;
    line-height: 2;
    color: rgba(238,226,214,0.88);
    margin: 0 0 40px;
    max-width: 34ch;
    margin-inline:auto;
  }

  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding: 15px 42px;
    font-family:'Amiri', serif;
    font-size: 19px;
    color: var(--void);
    text-decoration:none;
    background: linear-gradient(180deg, var(--gold), #a9803f);
    border-radius: 3px;
    letter-spacing: 0.5px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 10px 30px rgba(201,161,90,0.25);
  }

  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(201,161,90,0.4);
  }

  .cta:active{
    transform: translateY(0px);
  }

  .cta svg{
    width:18px; height:18px;
    fill: var(--wine-deep);
  }

  .footer-note{
    margin-top: 30px;
    font-size: 14px;
    color: rgba(201,161,90,0.5);
    letter-spacing:0.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .cta{ transition:none; }
  }
</style>
</head>
<body>

  <div class="card">
    <p class="eyebrow">إلى قلبٍ واحد</p>
    <h1>لكِ يا قلبي</h1>
    <div class="divider"></div>
    <p class="body-text">كل هذا من أجلكِ<br>وعشان إني بحبك</p>

    <a class="cta" href="https://confident-crimp-pang.ngrok-free.dev" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.8-10-9.3C.6 8.4 2 5 5.3 5c2 0 3.4 1 4.7 2.7C11.3 6 12.7 5 14.7 5 18 5 19.4 8.4 22 11.7 19.5 16.2 12 21 12 21z"/></svg>
      تعالي هنا
    </a>

    <p class="footer-note">— لكِ، دائمًا</p>
  </div>

</body>
</html>
